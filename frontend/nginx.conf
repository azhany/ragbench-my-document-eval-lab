server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page application: serve the built bundle and fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy the Go API, including health/readiness, inside the Compose network.
    location /healthz {
        proxy_pass http://backend:8080/healthz;
        proxy_set_header Host $host;
    }

    location /readyz {
        proxy_pass http://backend:8080/readyz;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
    }
}

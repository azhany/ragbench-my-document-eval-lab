services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ragbench
      POSTGRES_USER: ragbench
      POSTGRES_PASSWORD: ragbench
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://ragbench:ragbench@postgres:5432/ragbench?sslmode=disable
    depends_on:
      - postgres
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"

  airflow:
    # Intentionally left as a project integration point.
    # Use the official Airflow Docker Compose pattern when implementation begins.
    image: apache/airflow:3.0.6
    depends_on:
      - postgres

volumes:
  postgres_data:
